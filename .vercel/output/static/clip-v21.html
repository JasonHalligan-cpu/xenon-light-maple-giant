<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElevatorIQ clip</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #f5e27a; font-family: system-ui, sans-serif; }
    .back { position: fixed; top: 12px; left: 12px; color: #f5e27a; z-index: 2; }
    .bar { display: flex; gap: 8px; justify-content: center; padding: 56px 12px 12px; }
    button, nav a {
      min-height: 48px;
      min-width: 120px;
      justify-content: center;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: #f5e27a;
      color: #111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    video {
      display: block;
      width: 100%;
      height: calc(100vh - 200px);
      object-fit: contain;
      background: #000;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px;
      background: #111;
    }
  </style>
</head>
<body>
  <a class="back" href="/">Back</a>
  <div class="bar">
    <button type="button" id="play">Play</button>
    <button type="button" id="volume">Volume</button>
  </div>
  <video id="clip" src="/clip-linkedin.mp4?v=8" loop playsinline></video>
  <nav>
    <a download="elevatoriq-linkedin.mp4" href="/clip-linkedin.mp4?v=8">Download LinkedIn</a>
    <a download="elevatoriq-instagram.mp4" href="/clip-instagram.mp4?v=8">Download Instagram Reel</a>
    <a download="elevatoriq-instagram-feed.mp4" href="/clip-instagram-feed.mp4?v=8">Download Instagram feed</a>
  </nav>
  <script>
    var v = document.getElementById("clip");
    var play = document.getElementById("play");
    var volume = document.getElementById("volume");

    play.addEventListener("click", function () {
      if (v.paused) {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
        play.textContent = "Pause";
      } else {
        v.pause();
        play.textContent = "Play";
      }
    });

    volume.addEventListener("click", function () {
      v.muted = !v.muted;
      volume.textContent = v.muted ? "Muted" : "Volume";
      if (v.paused) {
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
        play.textContent = "Pause";
      }
    });
  </script>
</body>
</html>
