<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElevatorIQ clip</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #f5e27a; font-family: system-ui, sans-serif; }
    .back { position: fixed; top: 12px; left: 12px; color: #f5e27a; z-index: 2; }
    .stage { position: relative; }
    video {
      width: 100%;
      height: calc(100vh - 120px);
      object-fit: contain;
      background: #000;
    }
    #volume {
      position: absolute;
      right: 16px;
      bottom: 28px;
      z-index: 3;
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: #f5e27a;
      color: #111;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px;
      background: #111;
    }
    nav a {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      background: #f5e27a;
      color: #111;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <a class="back" href="/">Back</a>
  <div class="stage">
    <video id="clip" src="/clip-linkedin.mp4?v=7" autoplay loop playsinline></video>
    <button type="button" id="volume">Volume</button>
  </div>
  <nav>
    <a download="elevatoriq-linkedin.mp4" href="/clip-linkedin.mp4?v=7">Download LinkedIn</a>
    <a download="elevatoriq-instagram.mp4" href="/clip-instagram.mp4?v=7">Download Instagram Reel</a>
    <a download="elevatoriq-instagram-feed.mp4" href="/clip-instagram-feed.mp4?v=7">Download Instagram feed</a>
  </nav>
  <script>
    const v = document.getElementById("clip");
    const button = document.getElementById("volume");
    v.controls = false;
    v.muted = false;
    v.volume = 1;

    button.addEventListener("click", () => {
      if (v.muted) {
        v.muted = false;
        v.volume = 1;
        button.textContent = "Volume";
      } else {
        v.muted = true;
        v.volume = 0;
        button.textContent = "Muted";
      }
      if (v.paused) v.play();
    });
  </script>
</body>
</html>
